[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentknit"
# Placeholder. The published version is decided at release time by
# pyproject-bump-pypi, which reads the current version from PyPI and bumps
# that; this value is only a fallback for a package PyPI has never seen.
#
# It is deliberately high rather than 0.0.0: agentknit-tui requires
# "agentknit>=0.2.0,<1", so a lower placeholder makes a locally built pair
# uninstallable together and forces --no-deps on anyone working across both
# repositories.
version = "0.999.0"
description = "Build reliable coding agents for any OpenAI-compatible /chat/completions endpoint—with spec-driven tools, observability, cache verification, context compaction, and sandboxing. Less glue code, fewer crossed fingers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "agentknit contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
agentknit = "agentknit:main"

[tool.hatch.build.targets.wheel]
packages = ["agentknit"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit select (the pre-0.16 default) so the checked rules do not change
# underneath us: ruff 0.16+ ships a different, wider default set (I/UP/BLE/
# DTZ/S/PLW/RUF/SIM/…) and drops E402/E721/E741/E701 from it. Widen this
# list deliberately when wanted; see the 0.16 bump notes in the repo history.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["agentknit"]
