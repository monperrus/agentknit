name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[keyring]
          pip install pytest pytest-cov

      - name: Lint with ruff
        run: |
          # Rule selection is pinned in pyproject.toml ([tool.ruff.lint] select),
          # so any recent ruff works; >=0.15 keeps 3.11 target-version support.
          pip install "ruff>=0.15.12"
          ruff check agentknit/

      - name: Type-check with mypy (strict)
        run: |
          pip install "mypy~=2.1.0" types-requests
          python -m mypy agentknit/

      - name: Seed user-level config (leak detector)
        run: |
          # CI runs with a bare home, so a test that accidentally reads the
          # user's real ~/.agentknit or ~/.claude config passes here and fails
          # on a developer machine.  Plant config in $HOME so that any such
          # leak fails the build instead.  conftest.py isolates $HOME, so a
          # correct suite never sees these files.
          mkdir -p "$HOME/.agentknit" "$HOME/.claude"
          cat > "$HOME/.agentknit/hooks.json" <<'JSON'
          {"hooks": {"Stop": [{"hooks": [{"type": "command", "command": "echo ci-home-leak"}]}]}}
          JSON
          echo 'ci-home-leak: this file must never reach a test.' > "$HOME/.claude/CLAUDE.md"

      - name: Run tests with pytest
        run: |
          python -m pytest --cov=agentknit --cov-report=term-missing -v
